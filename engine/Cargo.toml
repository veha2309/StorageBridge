[package]
name = "storage-bridge"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
parking_lot = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
futures-executor = "0.3"
threadpool = "1.8"
winfsp = { version = "0.13.2", features = ["windows-61"] }
widestring = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.build-dependencies]
winfsp = "0.13.2"

[dev-dependencies]
tempfile = "3"
